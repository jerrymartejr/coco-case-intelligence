# dbt profile for Case Intelligence.
#
# Every setting comes from an environment variable. The three that identify YOUR account
# have no default on purpose: dbt fails with a clear message rather than silently trying
# to reach somebody else's warehouse.
#
#   cp .env.example .env && edit .env && source .env
#
# See docs/SETUP.md. The private key itself never lives in this repo.
case_intelligence:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'ACCOUNTADMIN') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'CASE_INTEL') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'COMPUTE_WH') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA', 'ANALYTICS') }}"
      threads: 4
      client_session_keep_alive: false
