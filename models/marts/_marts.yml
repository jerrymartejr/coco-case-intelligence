version: 2

models:
  - name: fct_case_fact
    description: "Stage 3 core table. One row per resolved case with AI-synthesised fields."
    columns:
      - name: case_id
        description: "Primary key, generated in Stage 2 identity resolution."
        tests:
          - unique
          - not_null
      - name: resolved
        tests:
          - not_null

  - name: fct_case_enriched
    description: "Stage 4. Case facts fused with structured metrics. One row per case."
    columns:
      - name: case_id
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('fct_case_fact')
                field: case_id

  - name: agg_root_cause_daily
    description: "Stage 5 rollup: root-cause category x day. Grouped on the controlled
      vocabulary, never the free-text root_cause, so one driver cannot split across wordings."
    columns:
      - name: case_count
        tests:
          - not_null
      - name: root_cause_category
        description: "Controlled vocabulary assigned in Stage 3; off-list values forced to Other."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Delivery failure', 'Fulfilment error', 'Billing error', 'Refund delay',
                         'Payment processing failure', 'Account access', 'Product defect',
                         'Returns or warranty policy', 'Subscription management',
                         'Customer record error', 'Service handling', 'Other']

  - name: agg_agent_performance
    description: "Stage 5 rollup: per agent."
    columns:
      - name: agent_id
        tests:
          - unique
          - not_null
