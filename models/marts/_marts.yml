version: 2

models:
  - name: fct_case_fact
    description: "Stage 3 core table. One row per resolved case with AI-synthesised fields."
    columns:
      - name: case_id
        description: "Primary key, generated in Stage 2 identity resolution."
        tests:
          - unique
          - not_null
      - name: resolved
        tests:
          - not_null

  - name: fct_case_enriched
    description: "Stage 4. Case facts fused with structured metrics. One row per case."
    columns:
      - name: case_id
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('fct_case_fact')
                field: case_id

  - name: agg_root_cause_daily
    description: "Stage 5 rollup: root-cause category x day. Grouped on the controlled
      vocabulary, never the free-text root_cause, so one driver cannot split across wordings."
    columns:
      - name: case_count
        tests:
          - not_null
      - name: root_cause_category
        description: "Controlled vocabulary assigned in Stage 3; off-list values forced to Other."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Delivery failure', 'Fulfilment error', 'Billing error', 'Refund delay',
                         'Payment processing failure', 'Account access', 'Product defect',
                         'Returns or warranty policy', 'Subscription management',
                         'Customer record error', 'Service handling', 'Other']

  - name: agg_agent_performance
    description: "Stage 5 rollup: per agent."
    columns:
      - name: agent_id
        tests:
          - unique
          - not_null

  - name: eval_case_linkage
    description: "Measurement only. Stage 2's predictions joined to the ground-truth key.
      Never read upstream: the answer key enters as a seed and is used nowhere in the
      pipeline, which is the only reason the accuracy numbers mean anything."
    columns:
      - name: record_id
        tests:
          - unique
          - not_null
      - name: tier
        tests:
          - accepted_values:
              arguments:
                values: ['A', 'B', 'C', 'D', 'noise']

  - name: agg_linkage_accuracy
    description: "Stage 5: the linkage scoreboard, per tier and adversarial shape. Tiers
      A-C are a regression floor generated under the resolver's own assumptions; tier D
      breaks those assumptions on purpose and is the honest result."
    columns:
      - name: tier
        tests:
          - not_null
      - name: fully_linked
        description: "True cases whose records all landed in one predicted case. On the
          noise row this counts records that stayed isolated instead."
        tests:
          - not_null
      - name: false_merges
        description: "Predicted cases holding records from more than one true case."
        tests:
          - not_null

  - name: search_corpus
    description: "Stage 5 retrieval, at RECORD grain. Backs the CASE_RECORD_SEARCH Cortex
      Search service; every hit carries its resolved case and that case's derived
      attributes, so retrieval and analysis join in one step."
    columns:
      - name: record_id
        tests:
          - unique
          - not_null
      - name: case_id
        tests:
          - not_null
