version: 2

models:
  - name: int_case_assignments
    description: "Stage 2 identity resolution. Record -> case_id map with customer resolution."
    columns:
      - name: record_id
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('int_record_entities')
                field: record_id
      - name: case_id
        tests:
          - not_null

  - name: int_case_records
    columns:
      - name: record_id
        tests:
          - unique
          - not_null
